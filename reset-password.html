<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu | AI CHECK THĐ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background: radial-gradient(circle at 18% 18%, rgba(217, 242, 108, .16) 0%, transparent 42%),
                  radial-gradient(circle at 82% 82%, rgba(36, 114, 79, .3) 0%, transparent 52%),
                  linear-gradient(135deg, #0c2621 0%, #163d35 50%, #09201b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      transition: background 0.3s ease;
    }
    .card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 2.2rem 2rem;
      border-radius: 18px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: reset-entrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes reset-entrance {
      from { opacity: 0; transform: translateY(22px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.2rem;
    }
    .badge {
      background: #d9f26c;
      color: #123e35;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .title {
      font-size: 1.45rem;
      color: #151717;
      font-weight: 700;
      margin-bottom: 0.4rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.88rem;
      margin-bottom: 1.4rem;
      line-height: 1.45;
    }
    .form-group {
      margin-bottom: 1.1rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #ffffff;
    }
    input:focus {
      border-color: #2d79f3;
      box-shadow: 0 0 0 3px rgba(45, 121, 243, 0.14);
    }
    button {
      width: 100%;
      padding: 13px;
      background: #151717;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #252727;
      transform: translateY(-1px);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      color: #2d79f3;
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .message {
      margin-top: 1rem;
      font-size: 0.88rem;
      text-align: center;
      line-height: 1.45;
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
    }
    .message.error {
      color: #b91c1c;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      display: block;
    }
    .message.success {
      color: #15803d;
      background: #dcfce7;
      border: 1px solid #86efac;
      display: block;
    }

    /* Dark Mode */
    [data-theme="dark"] body {
      background: radial-gradient(circle at 18% 18%, rgba(217, 242, 108, 0.12) 0%, transparent 42%),
                  radial-gradient(circle at 82% 82%, rgba(36, 114, 79, 0.22) 0%, transparent 52%),
                  linear-gradient(135deg, #071714 0%, #0c2621 50%, #051310 100%);
    }
    [data-theme="dark"] .card {
      background: #0d2821;
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
    }
    [data-theme="dark"] .title {
      color: #ffffff;
    }
    [data-theme="dark"] .subtitle {
      color: #a2b7ac;
    }
    [data-theme="dark"] label {
      color: #eaf3ee;
    }
    [data-theme="dark"] input {
      background: #12332a;
      border-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    [data-theme="dark"] input:focus {
      border-color: #d9f26c;
      box-shadow: 0 0 0 3px rgba(217, 242, 108, 0.18);
    }
    [data-theme="dark"] button {
      background: #d9f26c;
      color: #0c2621;
      font-weight: 700;
    }
    [data-theme="dark"] button:hover {
      background: #e6f78a;
    }
    [data-theme="dark"] .back-link {
      color: #d9f26c;
    }
  </style>
</head>
<body>
  <!-- Tự động load theme -->
  <script>
    try {
      const theme = localStorage.getItem('aicheck:theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    } catch(e){}
  </script>

  <div class="card">
    <div class="brand">
      <span class="badge">AI</span>
      <span style="font-weight: bold; color: inherit;">AI CHECK THĐ</span>
    </div>
    
    <h1 class="title">Đặt lại mật khẩu mới</h1>
    <p class="subtitle">Nhập mật khẩu mới sau khi đã xác minh mã OTP thành công từ Gmail.</p>

    <div id="sessionNotice" class="message error" style="display:none;margin-bottom:14px"></div>

    <form id="reset-form">
      <div class="form-group">
        <label for="new-password">Mật khẩu mới</label>
        <input type="password" id="new-password" placeholder="Nhập ít nhất 6 ký tự" required minlength="6">
      </div>

      <div class="form-group">
        <label for="confirm-password">Xác nhận mật khẩu mới</label>
        <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu mới" required minlength="6">
      </div>

      <button type="submit" id="btn-submit">Cập nhật mật khẩu mới</button>
      <div id="msg" class="message"></div>
    </form>

    <a href="login.html" class="back-link">← Quay về trang Đăng nhập</a>
  </div>

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const form = document.getElementById('reset-form');
    const msg = document.getElementById('msg');
    const btnSubmit = document.getElementById('btn-submit');
    const sessionNotice = document.getElementById('sessionNotice');

    // Kiểm tra tính hợp lệ của phiên khôi phục (Recovery Session từ OTP)
    async function checkRecoverySession() {
      if (typeof supabase === 'undefined' || !window.AICHECK_CONFIG) return;
      if (!window.supabaseClient) {
        window.supabaseClient = supabase.createClient(window.AICHECK_CONFIG.supabaseUrl, window.AICHECK_CONFIG.supabaseAnonKey);
      }
      const client = window.supabaseClient;

      try {
        const { data: { user } } = await client.auth.getUser();
        // Nếu không có user trong session khôi phục
        if (!user) {
          sessionNotice.style.display = 'block';
          sessionNotice.innerHTML = '⚠️ <strong>Bạn chưa gửi & xác minh mã OTP!</strong><br>Vui lòng vào <a href="login.html" style="color:#0f766e;font-weight:700">Trang Đăng nhập → Quên mật khẩu</a> để nhận mã xác minh OTP qua Gmail trước khi đổi mật khẩu.';
          btnSubmit.disabled = true;
          btnSubmit.style.opacity = '0.5';
        }
      } catch(e){}
    }
    setTimeout(checkRecoverySession, 200);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!newPassword || newPassword.length < 6) {
        msg.className = "message error";
        msg.textContent = "Mật khẩu phải chứa ít nhất 6 ký tự!";
        return;
      }

      if (newPassword !== confirmPassword) {
        msg.className = "message error";
        msg.textContent = "Mật khẩu xác nhận không khớp!";
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Đang xử lý...";
      msg.className = "message";
      msg.textContent = "";

      if (!window.supabaseClient && typeof supabase !== 'undefined' && window.AICHECK_CONFIG) {
        window.supabaseClient = supabase.createClient(window.AICHECK_CONFIG.supabaseUrl, window.AICHECK_CONFIG.supabaseAnonKey);
      }
      const client = window.supabaseClient;

      if (!client || !client.auth) {
        msg.className = "message error";
        msg.textContent = "Lỗi: Chưa kết nối được với Supabase! Kiểm tra lại file supabase-config.js";
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Cập nhật mật khẩu mới";
        return;
      }

      try {
        const { data, error } = await client.auth.updateUser({
          password: newPassword
        });

        if (error) {
          msg.className = "message error";
          msg.textContent = "Lỗi đổi mật khẩu: " + error.message;
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Cập nhật mật khẩu mới";
        } else {
          msg.className = "message success";
          msg.textContent = "🎉 Đổi mật khẩu thành công! Đang chuyển hướng về đăng nhập...";
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        }
      } catch(err) {
        msg.className = "message error";
        msg.textContent = "Lỗi hệ thống: " + err.message;
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Cập nhật mật khẩu mới";
      }
    });
  </script>
</body>
</html>
