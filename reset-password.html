<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu | AI CHECK THĐ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #123e35;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .badge {
      background: #bef264;
      color: #1a2e05;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .title {
      font-size: 1.5rem;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #0d9488;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #123e35;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0d2d27;
    }
    .message {
      margin-top: 1rem;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }
    .message.error { color: #dc2626; display: block; }
    .message.success { color: #16a34a; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="badge">AI</span>
      <span style="font-weight: bold; color: #0f172a;">AI CHECK THĐ</span>
    </div>
    
    <h1 class="title">Tạo mật khẩu mới</h1>
    <p class="subtitle">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>

    <form id="reset-form">
      <div class="form-group">
        <label for="new-password">Mật khẩu mới</label>
        <input type="password" id="new-password" placeholder="Nhập ít nhất 6 ký tự" required minlength="6">
      </div>

      <div class="form-group">
        <label for="confirm-password">Xác nhận mật khẩu</label>
        <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu mới" required minlength="6">
      </div>

      <button type="submit" id="btn-submit">Cập nhật mật khẩu</button>
      <div id="msg" class="message"></div>
    </form>
  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Nhập thông tin cấu hình từ supabase-config.js của dự án -->
  <script src="supabase-config.js"></script>
  <script>
    const form = document.getElementById('reset-form');
    const msg = document.getElementById('msg');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        msg.className = "message error";
        msg.textContent = "Mật khẩu xác nhận không khớp!";
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Đang xử lý...";
      msg.className = "message";
      msg.textContent = "";

      // Gọi API Supabase để cập nhật mật khẩu người dùng
      const { data, error } = await supabaseClient.auth.updateUser({
        password: newPassword
      });

      if (error) {
        msg.className = "message error";
        msg.textContent = "Lỗi: " + error.message;
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Cập nhật mật khẩu";
      } else {
        msg.className = "message success";
        msg.textContent = "Đổi mật khẩu thành công! Đang chuyển hướng về đăng nhập...";
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      }
    });
  </script>
</body>
</html>
